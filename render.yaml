# Render.com Blueprint – KAMU BÍRÓSÁG
# A GitHub repó feltöltése után a Renderen: New → Blueprint (vagy New → Web Service,
# és kézzel ugyanezeket a beállításokat add meg). Dokumentáció: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: kamu-birosag
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    # Környezeti változók (a Render felületén is megadhatók: Environment fül).
    # A DATABASE_URL a TAROLAS.md szerint kell: nélküle a fiókok, a statisztika és az
    # avatárok az ingyenes Renderen minden újraindításkor elvesznek.
    envVars:
      - key: DATABASE_URL        # külső Postgres kapcsolati sztring (pl. Neon) – TITKOS, nem kerül a repóba
        sync: false
      - key: AUTH_BASE_URL       # a játék pontos címe, pl. https://kamu-birosag.onrender.com
        sync: false
      - key: AUTH_TRUST_PROXY    # a Render proxy mögött 1
        value: "1"
      # A következő titkokat a Render Environment fülén add meg (itt csak emlékeztető; a blueprint-szinkron ne kérje őket):
      # - key: ADMIN_TOKEN         # /admin oldal (hibanapló, mentések): legalább 24 véletlen karakter – TITKOS
      #   sync: false
      # - key: LEGEND_SECRET       # a legendás kártyák igénylő-linkjeihez (legalább 16 karakter) – TITKOS
      #   sync: false
      # Jelszó-visszaállító levél (Resend): lásd AUTH_BEALLITAS.md
      # - key: AUTH_MAIL_API_KEY
      #   sync: false
      # - key: AUTH_MAIL_FROM
      #   sync: false
      # Discord-belépés (opcionális): lásd AUTH_BEALLITAS.md
      # - key: AUTH_DISCORD_CLIENT_ID
      #   sync: false
      # - key: AUTH_DISCORD_CLIENT_SECRET
      #   sync: false
    #   - key: ALLOWED_ORIGIN    # csak akkor, ha külső domainről is csatlakoznának
    #     value: https://sajat-domain.hu
